<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">

  <link href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
  <header>

  </header>

  <main>
    <article class="card">
      <div class="profile-card">
        <img src="assets/image.jpeg" alt="student profile" class="profile-img">
      </div>
      <div class="content">
        <h1>
          CodingLab
        </h1>
        <p>
          YouTube & Blogger
        </p>
      </div>
      <div class="media-btn">
        <a href="#" style="background: #4267b2;">
          <i class="bx bxl-facebook"></i>
        </a>
        <a href="#" style="background: #e1306c;">
          <i class="bx bxl-instagram"></i>
        </a>
        <a href="#" style="background: #1da1f2;">
          <i class="bx bxl-twitter"></i>
        </a>
        <a href="#" style="background: #ff0000;">
          <i class="bx bxl-youtube"></i>
        </a>
      </div>
      <div class="buttons">
      <div class="button">Subscribe</div>
      <div class="button">Message</div>
      </div>
      <div class="analytics">
        <div class="data">
          <i class="bx bx-heart"></i>
          <span class="number">60k</span>
        </div>
        <div class="data">
          <i class="bx bx-message-rounded"></i>
          <span class="number">20k</span>
        </div>
        <div class="data">
          <i class="bx bx-share"></i>
          <span class="number">45k</span>
        </div>
      </div>
    </article>
  </main>

  <footer>

  </footer>
  
</body>
</html>
